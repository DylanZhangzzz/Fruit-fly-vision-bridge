<!doctype html><meta charset="utf-8"><title>同一画布连续标定与时序验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:17px system-ui}header{padding:20px;max-width:1000px;margin:auto}button{font:inherit;padding:12px;cursor:pointer}a{color:#8bd8fa}canvas{display:block;width:min(100vw,calc(74vh * 1.42857));height:auto;margin:auto}body.running header{display:none}body.running canvas{width:min(100vw,calc(100vh * 1.42857));height:auto}</style>
<header><h1>同一画布：标定 → 固定响应表 → 独立验收</h1><p>保持相机、屏幕亮度和显示窗口不变。整个过程约两分钟，自动完成两次采集及分析；中途保持全屏，画布不会切换页面。</p><p>灰阶标定通过后自动开始新刺激验收。使用独立黑白参考块校正跨采集亮度漂移，时序测试灰阶不参与响应表拟合。输出仍是数字灰阶解码与条件模型预测。</p><button id="start">全屏开始连续验证</button> <span id="status">就绪</span><div id="result"></div></header>
<canvas id="screen" width="1000" height="700"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const markers=[0,1,2,3].map(i=>{const im=new Image();im.src='/marker/'+i+'.png';return im});
const loaded=Promise.all(markers.map(im=>new Promise((resolve,reject)=>{if(im.complete&&im.naturalWidth)resolve();else{im.onload=resolve;im.onerror=reject}})));
const centers=[[100,90],[900,90],[900,610],[100,610]],grayPhases=[],temporalPhases=[];
const train=Array.from({length:32},(_,i)=>Math.round(i*255/31));
const holdout=Array.from({length:16},(_,i)=>Math.round((train[i*2]+train[i*2+1])/2));
grayPhases.push({kind:'baseline',level:128,duration:2});
for(let i=0;i<32;i++)grayPhases.push({kind:'train',level:train[(i*13)%32],duration:.7});
for(let i=0;i<16;i++)grayPhases.push({kind:'holdout',level:holdout[(i*5)%16],duration:.7});
for(const level of [train[0],train[8],train[16],train[24],train[31],train[8],train[16],train[24]])grayPhases.push({kind:'repeat',level,duration:.7});
grayPhases.push({kind:'baseline_end',level:128,duration:1});
const add=(kind,duration,level=160,extra={})=>temporalPhases.push({kind,duration,level,...extra});
add('baseline',2);add('dark_step',.8,112);add('baseline',.5);add('light_step',.8,208);add('baseline',.5);
for(let i=0;i<4;i++){add('dark_flash',.2,112);add('baseline',.4)}
for(let i=0;i<4;i++){add('light_flash',.2,208);add('baseline',.4)}
for(const frequency of [1,2,4]){add('sine',3,160,{frequency,amplitude:48});add('baseline',.4)}
add('move_right',3,160,{bar_level:112,bar_width:80});add('baseline',.5);add('move_left',3,160,{bar_level:112,bar_width:80});
add('dark_anchor',.6,112);add('baseline',.6);add('light_anchor',.6,208);add('baseline',1);
for(const phases of [grayPhases,temporalPhases]){let t=0;phases.forEach((p,id)=>{p.id=id;p.start=t;t+=p.duration})}
function draw(p={id:0,kind:'baseline',level:128},elapsed=0){
 const level=Math.round(p.kind==='sine'?p.level+p.amplitude*Math.sin(2*Math.PI*p.frequency*elapsed):p.level);
 ctx.fillStyle='#888';ctx.fillRect(0,0,1000,700);ctx.fillStyle=`rgb(${level},${level},${level})`;ctx.fillRect(200,180,600,340);
 let pos=null;if(p.kind.startsWith('move_')){pos=p.kind==='move_right'?200+elapsed/p.duration*520:720-elapsed/p.duration*520;ctx.fillStyle=`rgb(${p.bar_level},${p.bar_level},${p.bar_level})`;ctx.fillRect(pos,180,p.bar_width,340)}
 centers.forEach(([x,y],i)=>{ctx.fillStyle='white';ctx.fillRect(x-47,y-47,94,94);ctx.drawImage(markers[i],x-35,y-35,70,70)});
 ctx.fillStyle='black';ctx.fillRect(300,105,60,45);ctx.fillStyle='white';ctx.fillRect(390,105,60,45);
 const code=p.id^(p.id>>1);for(let i=0;i<8;i++){const bit=(code>>i)&1,x=240+i*65;ctx.fillStyle=bit?'white':'black';ctx.fillRect(x,565,27,40);ctx.fillStyle=bit?'black':'white';ctx.fillRect(x+33,565,27,40)}
 return {level,pos};
}
loaded.then(()=>draw());const pause=ms=>new Promise(r=>setTimeout(r,ms));let busy=false;
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json()}
async function state(){return(await fetch('/api/status',{cache:'no-store'})).json()}
async function sequence(protocol,phases,calibration=null){
 const frames=[],events=[];let recording=false;draw(phases[0]);
 try{
  await post('/api/run',{protocol,calibration,stimulus_page:'continuous_validation.html',reference_correction:protocol==='calibrated_temporal_v1'?'dual_patch_affine_v1':null});
  for(;;){const s=await state();if(s.error)throw Error(s.error);if(s.ready)break;await pause(200)}
  recording=true;const start=performance.now(),end=phases.at(-1).start+phases.at(-1).duration;let last=-1;
  await new Promise((resolve,reject)=>{function tick(now){try{const t=Math.max(0,(now-start)/1000);if(t>=end){resolve();return}const p=phases.findLast(p=>p.start<=t),signal=draw(p,t-p.start);if(last!==p.id){events.push({phase_id:p.id,kind:p.kind,elapsed_s:t});last=p.id}const box=canvas.getBoundingClientRect();frames.push({elapsed_s:t,phase_id:p.id,...signal,visibility:document.visibilityState,canvas_rect:[box.x,box.y,box.width,box.height],viewport:[innerWidth,innerHeight]});requestAnimationFrame(tick)}catch(e){reject(e)}}requestAnimationFrame(tick)});
  await post('/api/finish',{protocol,calibration,stimulus_page:'continuous_validation.html',bit_encoding:'gray_dualrail_v2',phases,frames,events,duration_s:(performance.now()-start)/1000,canvas:[1000,700]});recording=false;
  for(;;){const s=await state();if(s.error)throw Error(s.error);if(s.phase==='done')return s;await pause(500)}
 }catch(e){if(recording)await post('/api/finish',{protocol,calibration,bit_encoding:'gray_dualrail_v2',phases,frames,events,aborted:true,error:String(e)}).catch(()=>{});throw e}
}
document.querySelector('#start').onclick=async()=>{
 if(busy)return;busy=true;
 try{
  await document.documentElement.requestFullscreen().catch(()=>{});await loaded;document.body.classList.add('running');
  const calibration=await sequence('photometric',grayPhases);
  const link=calibration.result_url;document.querySelector('#result').innerHTML=`<p><a href="${link}">本轮灰阶标定</a></p>`;
  if(calibration.result.status!=='PASS')throw Error('灰阶标定尚未通过，未启动时序实验');
  const run=link.match(/^\/runs\/([0-9-]+)\/index\.html$/)?.[1];if(!run)throw Error('无效标定路径');
  const validation=await sequence('calibrated_temporal_v1',temporalPhases,run);
  status.textContent=validation.result.status;document.querySelector('#result').innerHTML+=`<p><a href="${validation.result_url}">独立时序验收结果</a></p>`;
 }catch(e){status.textContent=e.message}finally{busy=false;document.body.classList.remove('running');draw()}
};
</script>
