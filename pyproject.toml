[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-fly-vision-bridge"
version = "0.1.0"
description = "Python webcam and RealSense bridge to MaleCNS fruit-fly brain simulations"
keywords = ["fruit-fly", "drosophila", "malecns", "connectome", "webcam", "realsense", "retinotopy", "visual-neuroscience"]
readme = "README.md"
requires-python = ">=3.11"
# Original code is MIT; distributions also contain separately licensed mapping data.
license = "MIT AND GPL-3.0-only AND CC-BY-SA-4.0 AND CC-BY-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt", "camera_lab/biomapping/source/LICENSE", "camera_lab/biomapping/source/visualpathways/LICENSE", "camera_lab/biomapping/source/eyemap_archive/LICENSE", "tests/fixtures/brain_cpu/LICENSE"]
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
analysis = ["scipy>=1.11,<2", "pandas>=2,<4", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4", "h5py>=3.10,<4", "rdata>=1.1,<2", "opencv-python-headless>=4.8,<6"]
camera = ["pyrealsense2>=2.55,<3", "opencv-python-headless>=4.8,<6"]

[project.scripts]
fly-vision = "flyvisionbridge.cli:main"
fly-vision-live = "flyvisionbridge.live:main"

[project.urls]
Repository = "https://github.com/DylanZhangzzz/Fruit-fly-vision-bridge"
Issues = "https://github.com/DylanZhangzzz/Fruit-fly-vision-bridge/issues"

[tool.setuptools.packages.find]
include = ["flyvisionbridge*", "camera_lab*"]

[tool.setuptools.package-data]
"flyvisionbridge" = ["brain_worker.mjs", "live_dashboard.html", "benchmark_protocol.json", "benchmark_sources.json"]
"camera_lab" = ["data/*.csv", "data/*.json"]
"camera_lab.biomapping" = ["data/*.csv", "data/*.json", "*.json"]
